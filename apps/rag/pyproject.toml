[project]
name = "agent-like-cc-rag"
version = "0.1.0"
description = "Canonical RAG REST and MCP facade with LightRAG orchestration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lightrag-hku[api]==1.5.4",
    "pypdf==6.14.2",
    "fastapi==0.139.0",
    "mcp==1.28.1",
    "httpx==0.28.1",
    "asyncpg==0.31.0",
    "pgvector==0.5.0",
    "python-dotenv==1.2.2",
    "PyMuPDF==1.26.5",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
